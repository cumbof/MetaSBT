[package]
name = "deltatree"
version = "0.1.0"
edition = "2021"
authors = ["Fabio Cumbo"]
description = "High-performance Rust backend for MetaSBT v2.0 Delta-SBT architecture"

[lib]
# The name here MUST match the name of the module imported in Python (import deltatree)
name = "deltatree"
# cdylib creates a dynamic library (.so on Linux, .dylib on macOS, .pyd for Python)
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings. The "extension-module" feature is required to build a Python library.
pyo3 = { version = "0.20", features = ["extension-module"] }

# Roaring Bitmaps for the compressed, updatable Delta filters
roaring = "0.10"

# Needletail is the fastest FASTA/FASTQ parser in the Rust ecosystem
needletail = "0.5"

# A fast hashing algorithm for generating k-mers
twox-hash = "1.6"

# Rayon for effortless multithreading in Rust (useful for parallel tree building)
rayon = "1.8"

# Serialization for saving tree configurations/metadata
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
