name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,bioconda,defaults
          channel-priority: strict
          auto-activate-base: true
          activate-environment: ""

      - name: Install external tools via conda
        run: |
          conda install -y mamba -n base -c conda-forge
          mamba install -y -c bioconda -c conda-forge \
            howdesbt \
            ntcard \
            kitsune \
            checkm-genome \
            checkv \
            busco \
            kraken2

      - name: Cache CheckV database
        id: cache-checkv-db
        uses: actions/cache@v4
        with:
          path: ~/checkv_db
          key: checkv-db-${{ runner.os }}-v1

      - name: Download CheckV database
        if: steps.cache-checkv-db.outputs.cache-hit != 'true'
        run: checkv download_database ~/checkv_db

      - name: Install MetaSBT
        run: pip install -e .

      - name: Run tests
        run: metasbt test --references test/references.tsv --mags test/mags.txt
        env:
          CHECKVDB: ~/checkv_db
